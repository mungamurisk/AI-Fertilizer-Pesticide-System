
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Signup | Smart Agriculture</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section>
            <h1>🌱 Farmer Registration</h1>
            <p>Create your account to access smart fertilizer and pesticide recommendations.</p>

            <form id="signupForm">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="phone">Mobile Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

                <label for="village">Village / Location</label>
                <input
                    type="text"
                    id="village"
                    name="village"
                    placeholder="Enter your village or district"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    placeholder="At least 8 characters"
                    required
                >

                <button type="submit" id="signupButton">
                    Create Account
                </button>

                <p id="signupMessage" aria-live="polite"></p>
            </form>

            <p>Already registered? <a href="login.html">Login here</a></p>
            <p><a href="index.html">← Back to Home</a></p>
        </section>
    </main>

    <script src="signup.js"></script>
</body>
</html>
